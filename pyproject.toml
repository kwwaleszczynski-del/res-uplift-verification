[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "res-uplift-verification"
version = "0.1.0"
description = "Causal verification of upgrades and O&M interventions on wind turbines and PV systems from SCADA data: synthetic control with conformal inference, Bayesian structural time series, ML counterfactuals, difference-in-differences and the industry test-control method, validated with injected effects."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pvlib>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
res-uplift = "res_uplift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
